AWSTemplateFormatVersion: "2010-09-09"
Description: Cathay Xplorers - container registry for the backend image. Deploy this first, push an image, then deploy app.yaml.

Parameters:
  RepositoryName:
    Type: String
    Default: cathay-xplorers-api

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      # Tags are git commit hashes, so a tag never points at two different images.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Lets `delete-stack` remove the repository even when it still holds images.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
